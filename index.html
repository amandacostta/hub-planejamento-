<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pauta Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FFFFFF; --side:#F6F7F9; --surface:#FFFFFF; --surface-2:#F4F5F8; --surface-3:#ECEEF2;
  --line:#E5E7EC; --line-2:#D6D9E0;
  --ink:#14161B; --ink-2:#474C57; --ink-3:#868B96; --ink-4:#B4B8C1;
  --blue:#2356E0; --blue-ink:#1A44B8; --blue-soft:#EBF0FD; --blue-line:#C9D6FA; --on-blue:#FFFFFF;
  --shadow:0 1px 2px rgba(20,22,27,.04),0 2px 8px rgba(20,22,27,.04);
  --shadow-lg:0 12px 40px rgba(20,22,27,.14),0 2px 8px rgba(20,22,27,.06);
  --overlay:rgba(20,22,27,.28);
  --s-ideia:#9AA0AB; --s-briefing:#8C7FD0; --s-aguardando:#C99A2E; --s-criacao:#2356E0; --s-revisao:#DB7F27;
  --s-ajustes:#D0493F; --s-aprovado:#2A9A66; --s-agendado:#2E98B0; --s-publicado:#14161B;
  --t-estatico:#5A6B8C; --t-carrossel:#7A63C2; --t-reel:#C24F7A; --t-story:#C08A1E; --t-meta:#2356E0; --t-google:#2A8A5C; --t-outro:#868B96;
  --danger:#C8423A; --danger-soft:#FBECEB; --ok:#2A9A66; --warn:#C99A2E; --warn-soft:#FBF4E3;
  --r:10px; --r-sm:7px;
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1114; --side:#14171B; --surface:#171A1F; --surface-2:#1C2026; --surface-3:#242931;
    --line:#262B33; --line-2:#323843;
    --ink:#ECEEF2; --ink-2:#B5BAC4; --ink-3:#7E8490; --ink-4:#555B66;
    --blue:#5B86F6; --blue-ink:#8AA8FA; --blue-soft:#18233D; --blue-line:#2B3E6B; --on-blue:#0B1020;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 16px 48px rgba(0,0,0,.5);
    --overlay:rgba(0,0,0,.5);
    --s-publicado:#ECEEF2; --danger:#E46A61; --danger-soft:#33191A; --warn-soft:#2E2614;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1114; --side:#14171B; --surface:#171A1F; --surface-2:#1C2026; --surface-3:#242931;
  --line:#262B33; --line-2:#323843;
  --ink:#ECEEF2; --ink-2:#B5BAC4; --ink-3:#7E8490; --ink-4:#555B66;
  --blue:#5B86F6; --blue-ink:#8AA8FA; --blue-soft:#18233D; --blue-line:#2B3E6B; --on-blue:#0B1020;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  --overlay:rgba(0,0,0,.5);
  --s-publicado:#ECEEF2; --danger:#E46A61; --danger-soft:#33191A; --warn-soft:#2E2614;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.logo b{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.01em;display:block}
.logo small{display:block;color:var(--ink-3);font-size:11.5px}
.nav-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface-3);color:var(--ink)}
.nav a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.nav a.on .ico{color:var(--blue)}
.nav a{border:1px solid transparent}
.nav .count{margin-left:auto;font-size:11px;color:var(--ink-3);font-family:var(--f-mono)}
.nav .count.alert{color:var(--danger)}
.side-foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:8px}
.designer-link{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px dashed var(--line-2);color:var(--ink-2);font-weight:500;text-decoration:none}
.designer-link:hover{border-color:var(--blue);color:var(--blue)}
.designer-link.on{border-style:solid;border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.mode-note{font-size:11.5px;color:var(--ink-3);padding:0 10px;display:flex;gap:6px;align-items:center}
.mode-note i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.mode-note i.local{background:var(--warn)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-av{width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.brand b{font-weight:600;white-space:nowrap}
.brand small{color:var(--ink-3);display:block;font-size:11.5px;line-height:1.2}
.month-nav{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface);height:36px}
.month-nav button{height:100%;padding:0 9px;color:var(--ink-2);display:grid;place-items:center}
.month-nav button:hover{color:var(--ink)}
.month-nav .m-label{font-weight:600;padding:0 6px;min-width:128px;text-align:center;border-inline:1px solid var(--line)}
.search{flex:1;min-width:180px;max-width:420px;position:relative}
.search input{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:0 12px 0 34px;outline:none;transition:border-color .15s,background .15s}
.search input:focus{border-color:var(--blue);background:var(--surface)}
.search .ico{position:absolute;left:11px;top:10px;color:var(--ink-3)}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);position:relative;transition:border-color .15s,color .15s}
.icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
.icon-btn.active{color:var(--blue);border-color:var(--blue-line);background:var(--blue-soft)}
.badge-dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;border:2px solid var(--bg)}
.menu-btn{display:none}

.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.primary:hover{background:var(--blue-ink);border-color:var(--blue-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.xs{height:26px;padding:0 8px;font-size:12px;border-radius:7px;gap:5px}
.btn.danger{color:var(--danger)}
.btn.soft{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue-ink)}
.btn .ico{width:15px;height:15px}

.page{padding:26px 28px 80px;display:flex;flex-direction:column;gap:22px;max-width:1440px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
h1{font-family:var(--f-display);font-weight:600;font-size:28px;letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance;line-height:1.15}
h2{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.01em;margin:0}
h3{font-size:13px;font-weight:600;margin:0}
.sub{color:var(--ink-3);margin:4px 0 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 0}
.grid{display:grid;gap:16px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:7px;color:var(--ink-2);font-weight:500;font-size:13px;display:flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- Pills ---------- */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.status.pill{padding:3px 9px 3px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--ink)}
.type{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.type-ico{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 12%,transparent);color:var(--tc);flex:none}
.type-ico .ico{width:12px;height:12px;stroke-width:2}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--ink-2);white-space:nowrap}
.chip.blue{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue-ink)}
.chip.late{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.chip button{display:grid;place-items:center;color:inherit}
.av{width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);display:inline-grid;place-items:center;font-size:10px;font-weight:600;flex:none;border:1.5px solid var(--surface)}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;text-align:left}
.kpi:hover{border-color:var(--blue-line);transform:translateY(-1px)}
.kpi .k-label{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.kpi .k-val{font-family:var(--f-display);font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1}
.kpi .k-foot{font-size:11.5px;color:var(--ink-3)}
.kpi.hero{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.kpi.hero .k-label,.kpi.hero .k-foot{color:color-mix(in srgb,var(--bg) 70%,transparent)}

.prod-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-3);gap:2px}
.prod-bar span{display:block;height:100%;transition:flex-grow .5s ease}
.prod-legend{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:16px}
.prod-legend button{text-align:left;padding:10px 12px;border-radius:9px;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;transition:border-color .15s}
.prod-legend button:hover{border-color:var(--line-2)}
.prod-legend .pl-top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.prod-legend .pl-top i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.prod-legend b{font-family:var(--f-display);font-size:22px;font-weight:600}
.mix{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);margin-top:18px}
.mix div{padding:12px 4px 0;display:flex;flex-direction:column;gap:2px}
.mix div+div{padding-left:14px;border-left:1px solid var(--line)}
.mix b{font-family:var(--f-display);font-size:20px;font-weight:600}
.mix span{font-size:11.5px;color:var(--ink-3)}

.dash-cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.up-list{display:flex;flex-direction:column;padding:8px 8px 10px}
.up-item{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:9px;text-align:left;transition:background .15s}
.up-item:hover{background:var(--surface-2)}
.datebox{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;height:46px;background:var(--surface)}
.datebox b{font-family:var(--f-display);font-size:18px;line-height:1;font-weight:600}
.datebox small{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.datebox.today{border-color:var(--blue);color:var(--blue)}
.up-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-meta{display:flex;gap:10px;align-items:center;margin-top:3px;flex-wrap:wrap}

.pend-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 20px 4px}
.pend-tabs button{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);transition:all .15s}
.pend-tabs button b{font-family:var(--f-mono);font-size:11.5px;font-weight:500;color:var(--ink-3)}
.pend-tabs button.on{border-color:var(--ink);color:var(--ink);background:var(--surface-2)}
.pend-tabs button.on b{color:var(--ink)}
.pend-tabs button.late b{color:var(--danger)}
.pend-list{padding:6px 8px 10px;display:flex;flex-direction:column}
.pend-row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;text-align:left}
.pend-row:hover{background:var(--surface-2)}
.pend-row .grow{flex:1;min-width:0}
.pend-row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.camp-mini{display:flex;flex-direction:column;gap:14px;padding:16px 20px 20px}
.camp-mini button{text-align:left;display:flex;flex-direction:column;gap:7px}
.camp-mini .row{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar span{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .5s ease}

/* ---------- Calendar ---------- */
.cal{overflow:hidden}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head div{padding:10px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;border-bottom:1px solid var(--line)}
.cal-cell{min-height:124px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:4px;position:relative;transition:background .15s}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell.out{background:var(--surface-2)}
.cal-cell.out .cal-day{color:var(--ink-4)}
.cal-cell:hover .cal-add{opacity:1}
.cal-cell.drop{background:var(--blue-soft)}
.cal-day{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
.cal-day.today span{background:var(--blue);color:var(--on-blue);border-radius:6px;padding:1px 6px}
.cal-add{opacity:0;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3);transition:opacity .15s}
.cal-add:hover{background:var(--surface-3);color:var(--blue)}
.ev{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:12px;min-width:0;transition:border-color .15s,box-shadow .15s;cursor:pointer}
.ev:hover{border-color:var(--blue-line);box-shadow:var(--shadow)}
.ev .type-ico{width:16px;height:16px;border-radius:4px}
.ev .type-ico .ico{width:10px;height:10px}
.ev .ev-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ev .sd{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.ev.late{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.ev.done .ev-t{color:var(--ink-3)}
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.week-col{display:flex;flex-direction:column;gap:8px;min-height:340px;background:var(--surface-2);border-radius:var(--r);padding:10px;border:1px solid transparent}
.week-col.today{border-color:var(--blue-line)}
.week-col.drop{background:var(--blue-soft)}
.week-col-h{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px 6px}
.week-col-h b{font-family:var(--f-display);font-size:20px;font-weight:600}
.week-col-h span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left;box-shadow:var(--shadow);transition:border-color .15s,transform .15s;cursor:pointer}
.wcard:hover{border-color:var(--blue-line);transform:translateY(-1px)}
.wcard .t{font-weight:500;line-height:1.3}
.wcard .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--ink-3)}
.list-day{display:grid;grid-template-columns:90px minmax(0,1fr);gap:16px;padding:14px 20px;border-bottom:1px solid var(--line)}
.list-day:last-child{border-bottom:0}
.list-day .ld{font-family:var(--f-display);font-weight:600;font-size:15px}
.list-day .ld small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--ink-3)}
.list-items{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 150px 120px 140px;gap:12px;align-items:center;padding:8px 10px;border-radius:8px;text-align:left}
.lrow:hover{background:var(--surface-2)}
.lrow .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .12s;cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td .t{font-weight:500}
td .s{font-size:12px;color:var(--ink-3);margin-top:1px}
.row-actions{display:flex;gap:2px;justify-content:flex-end;opacity:.55;transition:opacity .15s}
tr:hover .row-actions{opacity:1}
.tick{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center}
.tick.yes{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.tick.no{background:var(--surface-3);color:var(--ink-4)}
.tick .ico{width:11px;height:11px;stroke-width:2.4}
.link-icon{display:inline-flex;align-items:center;gap:5px;color:var(--blue);font-size:12.5px;font-weight:500;text-decoration:none}
.link-icon:hover{text-decoration:underline}

/* ---------- Kanban ---------- */
.flow{display:flex;align-items:center;gap:0;flex-wrap:wrap;row-gap:8px}
.flow-step{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.07em;font-weight:600;color:var(--ink-3)}
.flow-step b{font-family:var(--f-mono);font-weight:500;letter-spacing:0;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);border-radius:6px;padding:1px 7px;font-size:11.5px}
.flow-arrow{color:var(--ink-4);margin:0 10px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:220px;border:1px solid transparent;transition:background .15s,border-color .15s}
.col.drop{background:var(--blue-soft);border-color:var(--blue-line)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 6px}
.col-h .status{font-weight:600;color:var(--ink)}
.col-h small{font-family:var(--f-mono);color:var(--ink-3)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);cursor:grab;transition:border-color .15s,box-shadow .15s,opacity .15s}
.kcard:hover{border-color:var(--blue-line)}
.kcard.dragging{opacity:.4}
.kcard .t{font-weight:500;line-height:1.3}
.kcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.kcard .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.adv{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--blue);padding:3px 6px;border-radius:6px}
.adv:hover{background:var(--blue-soft)}

/* ---------- Ads ---------- */
.ads-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.ad-card{display:flex;flex-direction:column;overflow:hidden}
.ad-top{padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.ad-top .t{font-weight:600}
.ad-preview{margin:0 16px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.gp-url{font-size:12px;color:var(--ink-2)}
.gp-t{color:var(--blue-ink);font-size:16px;line-height:1.3;font-weight:500}
.gp-d{color:var(--ink-2);font-size:12.5px}
.mp-copy{color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.mp-foot b{font-size:13px}
.mp-foot span{font-size:12px;padding:5px 10px;border-radius:6px;background:var(--surface-3);font-weight:500;white-space:nowrap}
.ad-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;margin-top:auto}

/* ---------- Campaigns ---------- */
.camp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.camp{padding:18px 20px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:border-color .15s,transform .15s}
.camp:hover{border-color:var(--blue-line);transform:translateY(-1px)}
.camp-name{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.01em}
.camp-kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.camp-kv dt{color:var(--ink-3)}
.camp-kv dd{margin:0}
.type-counts{display:flex;gap:10px;flex-wrap:wrap}
.type-counts span{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--ink-2)}
.cs{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.cs.ativa{background:var(--blue-soft);color:var(--blue-ink)}
.cs.concluida{color:var(--ok)}
.detail-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--surface);padding:12px 16px}
.facts small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.group-title{display:flex;align-items:center;gap:8px;padding:14px 20px 6px;font-weight:600}

/* ---------- Library ---------- */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.lib-card{overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,transform .15s}
.lib-card:hover{border-color:var(--blue-line);transform:translateY(-1px)}
.lib-thumb{height:170px;background:var(--surface-2);display:grid;place-items:center;border-bottom:1px solid var(--line);position:relative}
.frame{border:1.5px solid var(--line-2);border-radius:5px;background:var(--surface);display:grid;place-items:center;color:var(--tc);max-width:100%}
.frame .ico{width:22px;height:22px}
.frame-size{position:absolute;bottom:8px;left:10px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.lib-thumb .status{position:absolute;top:9px;right:10px;background:var(--surface);padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:11.5px}
.lib-body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.lib-body .t{font-weight:500;line-height:1.3}
.lib-body .m{font-size:12px;color:var(--ink-3)}
.lib-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.filters-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 28px 0 10px;font-size:13px;color:var(--ink-2);appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 14px) 14px,calc(100% - 10px) 14px;background-size:4px 4px;background-repeat:no-repeat;max-width:100%}
.sel.set{border-color:var(--blue-line);color:var(--blue-ink);background-color:var(--blue-soft)}

/* ---------- Captions ---------- */
.cap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.cap{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.cap-text{white-space:pre-wrap;font-size:13.5px;color:var(--ink);line-height:1.55;max-height:150px;overflow:hidden;position:relative}
.cap-text.fade::after{content:"";position:absolute;inset:auto 0 0 0;height:40px;background:linear-gradient(transparent,var(--surface))}
.cap-meta{display:flex;gap:6px;flex-wrap:wrap}
.cap-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}

/* ---------- Reports ---------- */
.rep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:16px 18px}
.stat small{display:block;font-size:12.5px;color:var(--ink-2)}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:8px;line-height:1}
.stat span{font-size:12px;color:var(--ink-3)}
.vbars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:end;height:200px;padding:20px 20px 0;position:relative}
.vbar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.vbar .stack{width:100%;max-width:30px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden;min-height:2px;background:var(--surface-3);transition:height .5s ease}
.vbar .stack span{display:block;width:100%}
.vbar small{font-size:11px;color:var(--ink-3);padding-bottom:12px}
.vbar em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.vbar.cur small{color:var(--blue);font-weight:600}
.hbars{display:flex;flex-direction:column;gap:12px;padding:18px 20px 20px}
.hbar{display:grid;grid-template-columns:140px minmax(0,1fr) 32px;gap:12px;align-items:center;font-size:13px}
.hbar .track{height:10px;background:var(--surface-3);border-radius:5px;overflow:hidden}
.hbar .track span{display:block;height:100%;border-radius:5px;background:var(--blue);transition:width .5s ease}
.hbar b{font-family:var(--f-mono);font-weight:500;text-align:right;font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px;background:var(--c)}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:61;box-shadow:var(--shadow-lg);transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.d-head{padding:18px 24px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.d-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.d-title{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.2;margin:0;text-wrap:balance}
.d-sub{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-3)}
.d-body{flex:1;overflow-y:auto;padding:20px 24px 40px;display:flex;flex-direction:column;gap:18px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.stepper{display:flex;gap:4px}
.stepper div{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.stepper i{height:4px;border-radius:2px;background:var(--surface-3);transition:background .3s}
.stepper div.done i{background:var(--ink-2)}
.stepper div.cur i{background:var(--blue)}
.stepper div.adj i{background:var(--danger)}
.stepper span{font-size:10px;letter-spacing:.06em;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper div.cur span{color:var(--blue)}
.status-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status-ctl input{flex:1;min-width:160px;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);outline:none}
.status-ctl input:focus{border-color:var(--blue)}
.art-box{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);background:var(--blue-soft);border:1px solid var(--blue-line)}
.art-box .grow{flex:1;min-width:0}
.art-box .u{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art-box b{display:block;font-size:13.5px}
.art-box.missing{background:var(--warn-soft);border-color:transparent}
.btn.open-art{background:var(--blue);color:var(--on-blue);border-color:var(--blue);font-weight:600;letter-spacing:.04em;height:40px;padding:0 18px;text-decoration:none}
.btn.open-art:hover{background:var(--blue-ink)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv div{background:var(--surface);padding:10px 14px;min-width:0}
.kv small{display:block;font-size:11px;color:var(--ink-3);margin-bottom:2px}
.kv span{font-weight:500;font-size:13.5px;overflow-wrap:anywhere}
.textblock{white-space:pre-wrap;background:var(--surface-2);border-radius:var(--r);padding:14px 16px;line-height:1.6;font-size:13.5px;overflow-wrap:anywhere}
.textblock.art{background:var(--surface);border:1px dashed var(--line-2);font-weight:500}
.reflist{display:flex;flex-direction:column;gap:6px}
.ref{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;min-width:0}
.ref a{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none;font-size:13px}
.ref a:hover{text-decoration:underline}
.inline-add{display:flex;gap:8px}
.inline-add input{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);outline:none}
.inline-add input:focus{border-color:var(--blue)}
.cap-editor{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cap-editor:focus-within{border-color:var(--blue)}
.cap-tools{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.cap-tools .emo{width:28px;height:28px;border-radius:6px;font-size:15px;display:grid;place-items:center}
.cap-tools .emo:hover{background:var(--surface-3)}
.cap-tools .sep{width:1px;height:18px;background:var(--line-2);margin:0 4px}
.cap-editor textarea{width:100%;border:0;outline:none;resize:vertical;min-height:150px;padding:12px 14px;background:transparent;line-height:1.55}
.cap-count{display:flex;justify-content:space-between;padding:6px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono)}
.cap-count .over{color:var(--danger)}
.comments{display:flex;flex-direction:column;gap:10px}
.cmt{display:flex;gap:10px}
.cmt .body{flex:1;background:var(--surface-2);border-radius:0 10px 10px 10px;padding:9px 12px;font-size:13px}
.cmt .who{font-size:12px;color:var(--ink-3);margin-bottom:2px}
.cmt .who b{color:var(--ink);font-weight:600}
.timeline{display:flex;flex-direction:column;border-left:1.5px solid var(--line);margin-left:6px}
.tl{position:relative;padding:0 0 14px 18px;font-size:13px}
.tl::before{content:"";position:absolute;left:-5px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink-4));border:2px solid var(--bg)}
.tl .when{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.tl .note{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -24px;padding:0 24px;overflow-x:auto}
.dtabs button{padding:10px 12px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.dtabs button.on{color:var(--ink);border-color:var(--ink)}

/* designer mode */
.dz{display:flex;flex-direction:column;gap:2px}
.dz-item{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.dz-item:last-child{border-bottom:0}
.dz-n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);padding-top:2px}
.dz-l{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.dz-v{font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.dz-v.big{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.01em}
.dz-banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:9px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}

/* ---------- Modal / form ---------- */
.modal-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px 16px;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .2s}
.modal-wrap.on{opacity:1;pointer-events:auto}
.modal{background:var(--bg);border-radius:14px;box-shadow:var(--shadow-lg);width:min(820px,100%);max-height:calc(100dvh - 40px);display:flex;flex-direction:column;transform:translateY(10px) scale(.985);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.modal.sm{width:min(520px,100%)}
.modal-wrap.on .modal{transform:none}
.m-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.m-head h2{font-size:19px}
.m-body{overflow-y:auto;padding:6px 24px 24px}
.m-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
fieldset{border:0;padding:18px 0 4px;margin:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
fieldset:last-child{border-bottom:0}
legend{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:0;margin-bottom:14px;float:left;width:100%;grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lbl{font-size:12.5px;font-weight:500;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.f label .cnt{font-family:var(--f-mono);font-weight:400;color:var(--ink-3);font-size:11.5px}
.f label .cnt.over{color:var(--danger)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 11px;outline:none;transition:border-color .15s,box-shadow .15s}
.f input,.f select{height:38px}
.f textarea{resize:vertical;line-height:1.55;min-height:80px}
.f textarea.tall{min-height:180px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.f .hint{font-size:11.5px;color:var(--ink-3)}
.f input.err{border-color:var(--danger)}
.choices{display:flex;gap:6px;flex-wrap:wrap}
.choice{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.choice:hover{border-color:var(--line-2)}
.choice.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink);font-weight:500}
.dyn{display:flex;flex-direction:column;gap:6px}
.dyn-row{display:flex;gap:6px}
.dyn-row input{flex:1}

/* ---------- Popovers / toasts ---------- */
.pop{position:fixed;z-index:70;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .15s,transform .15s;max-width:calc(100vw - 24px)}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:300px;max-width:100%}
.months button{height:40px;border-radius:8px;border:1px solid var(--line);font-weight:500;position:relative}
.months button:hover{border-color:var(--line-2)}
.months button.on{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.months button small{position:absolute;top:3px;right:6px;font-family:var(--f-mono);font-size:9.5px;color:var(--ink-3)}
.months button.on small{color:var(--on-blue)}
.pop-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.filters-pop{width:440px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.notif{width:380px;padding:6px}
.notif-row{display:flex;gap:10px;padding:10px;border-radius:8px;text-align:left;width:100%;align-items:flex-start}
.notif-row:hover{background:var(--surface-2)}
.notif-row .ni{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.notif-row .ni.late{background:var(--danger-soft);color:var(--danger)}
.notif-row .ni.soon{background:var(--warn-soft);color:var(--warn)}
.notif-row .ni.rev{background:var(--blue-soft);color:var(--blue)}
.notif-row .nt{font-size:13px;font-weight:500}
.notif-row .ns{font-size:12px;color:var(--ink-3)}
.toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow-lg);animation:tin .25s cubic-bezier(.2,.8,.2,1)}
.toast.err{background:var(--danger);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 45%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.fab{display:none}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.skeleton{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.settings-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.team-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.team-row:last-child{border-bottom:0}
.team-row .grow{flex:1}
.setup{max-width:560px;margin:60px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}

/* ---------- Responsive ---------- */
@media (max-width:1280px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .prod-legend{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1100px){
  .dash-cols,.rep-grid,.settings-grid{grid-template-columns:minmax(0,1fr)}
  .lrow{grid-template-columns:minmax(0,1fr) 130px 120px}
  .lrow>:nth-child(3){display:none}
}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:90;transform:translateX(-102%);transition:transform .25s;box-shadow:var(--shadow-lg);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.on{transform:none}
  .menu-btn{display:grid}
  .top{padding:10px 16px}
  .page{padding:20px 16px 100px}
  .stat-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mix{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:12px}
  .mix div:nth-child(5){border-left:0;padding-left:4px}
  .new-top{display:none}
  .fab{display:inline-flex;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;box-shadow:var(--shadow-lg);height:46px;border-radius:23px;padding:0 18px}
}
@media (max-width:700px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prod-legend{grid-template-columns:repeat(2,minmax(0,1fr))}
  h1{font-size:23px}
  .search{order:5;max-width:none;flex-basis:100%}
  .brand small{display:none}
  .month-nav .m-label{min-width:104px;font-size:13px}
  .cal-cell{min-height:76px;padding:4px}
  .cal-head div{padding:8px 4px;font-size:10px;letter-spacing:.02em}
  .ev{padding:3px;justify-content:center}
  .ev .ev-t,.ev .sd{display:none}
  .lrow{grid-template-columns:minmax(0,1fr) auto}
  .lrow>:nth-child(2){display:none}
  .list-day{grid-template-columns:minmax(0,1fr);gap:6px;padding:12px 14px}
  fieldset{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hbar{grid-template-columns:96px minmax(0,1fr) 28px}
  .d-head,.d-body{padding-left:16px;padding-right:16px}
  .dtabs{margin:0 -16px;padding:0 16px}
  .filters-pop{width:calc(100vw - 32px);grid-template-columns:1fr}
  .notif{width:calc(100vw - 32px)}
  .m-head,.m-body,.m-foot{padding-left:16px;padding-right:16px}
  .vbars{gap:3px;padding:16px 10px 0}
  .art-box{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

<script>
(() => {
'use strict';

/* ================= Constantes ================= */
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MON3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const WD = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const TYPES = {
  estatico:{label:'Post estático',short:'Post'},
  carrossel:{label:'Carrossel',short:'Carrossel'},
  reel:{label:'Reel',short:'Reel'},
  story:{label:'Story',short:'Story'},
  meta:{label:'Anúncio Meta Ads',short:'Meta Ads'},
  google:{label:'Anúncio Google Ads',short:'Google Ads'},
  outro:{label:'Outro',short:'Outro'}
};
const STATUSES = [
  ['ideia','Ideia'],['briefing','Briefing'],['aguardando','Aguardando criação'],['criacao','Em criação'],
  ['revisao','Em revisão'],['ajustes','Ajustes solicitados'],['aprovado','Aprovado'],['agendado','Agendado'],['publicado','Publicado']
];
const ST = Object.fromEntries(STATUSES);
const NEXT = {ideia:'briefing',briefing:'aguardando',aguardando:'criacao',criacao:'revisao',revisao:'aprovado',ajustes:'revisao',aprovado:'agendado',agendado:'publicado'};
const NEXT_LABEL = {briefing:'Enviar para briefing',aguardando:'Briefing pronto',criacao:'Iniciar criação',revisao:'Enviar para revisão',aprovado:'Aprovar',agendado:'Agendar',publicado:'Marcar como publicado'};
const FLOW = [['ideia','IDEIA'],['briefing','BRIEFING'],['criacao','CRIAÇÃO'],['revisao','REVISÃO'],['ajustes','AJUSTES'],['aprovado','APROVADO'],['publicado','PUBLICADO']];
const FLOW_OF = {ideia:0,briefing:1,aguardando:1,criacao:2,revisao:3,ajustes:4,aprovado:5,agendado:5,publicado:6};
const OBJECTIVES = ['Institucional','Educacional','Engajamento','Conversão','Geração de leads','Divulgação de produto','Campanha promocional','Relacionamento','Awareness','Outro'];
const FORMATS = ['Feed 1080x1080','Feed 1080x1350','Story/Reels 1080x1920','Carrossel 1080x1350','Banner','Google Display','Outro'];
const CHANNELS = ['Instagram','Facebook','TikTok','LinkedIn','YouTube','Meta Ads','Google Ads','Site/Blog','E-mail'];
const PRIORITIES = {baixa:'Baixa',media:'Média',alta:'Alta'};
const CAMP_STATUS = {planejamento:'Planejamento',ativa:'Ativa',pausada:'Pausada',concluida:'Concluída'};
const EMOJIS = ['💙','🎀','✨','👇','👉','📍','📅','✅','🔬','🌿','💬','⚠️','😊','🙌'];
const IN_PROD = ['briefing','aguardando','criacao','ajustes'];
const DONE = ['aprovado','agendado','publicado'];
const IG_LIMIT = 2200;

/* ================= Estado ================= */
const today = new Date(); today.setHours(0,0,0,0);
const TODAY = iso(today);
const S = {
  mode:'loading', db:null,
  data:{settings:{brand:'Sua marca',handle:''},team:[],campaigns:[],contents:[],ads:[],captions:[]},
  loaded:{},
  ui:{view:'dashboard',year:today.getFullYear(),month:today.getMonth(),q:'',
      f:{type:'',campaign:'',channel:'',status:'',owner:'',objective:'',from:'',to:''},
      cal:'month',weekStart:null,lib:'cards',libF:{campaign:'',type:'',format:'',status:''},
      capF:{campaign:'',platform:'',type:''},adsTab:'meta',showArchived:false,campaign:null,pend:'late',
      repScope:'year',contentsSort:'date'},
  drawer:null, dtab:'geral', designer:false, writable:true
};
try{ const saved = JSON.parse(localStorage.getItem('ph-ui')||'null'); if(saved){ Object.assign(S.ui, {view:saved.view||'dashboard',cal:saved.cal||'month',lib:saved.lib||'cards',adsTab:saved.adsTab||'meta'}); } }catch(e){}
function saveUi(){ try{ localStorage.setItem('ph-ui',JSON.stringify({view:S.ui.view,cal:S.ui.cal,lib:S.ui.lib,adsTab:S.ui.adsTab})); }catch(e){} }

/* ================= Utilidades ================= */
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pd(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeUrl(u){ u=String(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; try{ const x=new URL(u); return /^https?:$/.test(x.protocol)?x.href:''; }catch(e){ return ''; } }
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u; } }
function fmtD(s){ const d=pd(s); return d? String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0') : '—'; }
function fmtDL(s){ const d=pd(s); return d? d.getDate()+' de '+MONTHS[d.getMonth()].toLowerCase() : '—'; }
function fmtDT(isoStr){ const d=new Date(isoStr); if(isNaN(d)) return ''; return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function mkey(y,m){ return y+'-'+String(m+1).padStart(2,'0'); }
function curKey(){ return mkey(S.ui.year,S.ui.month); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function uid(p){ return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function money(n){ return n? 'R$ '+Number(n).toLocaleString('pt-BR',{maximumFractionDigits:0}) : '—'; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
const I = (id,cls='') => `<svg class="ico ${cls}"><use href="#${id}"/></svg>`;

/* ================= Modelo ================= */
function camp(id){ return S.data.campaigns.find(c=>c.id===id); }
function member(id){ return S.data.team.find(t=>t.id===id); }
function initials(id){ const m=member(id); return m? (m.initials||m.name.split(' ').map(x=>x[0]).join('').slice(0,2)).toUpperCase() : '—'; }
function adTitle(a){ return a.adName || (a.platform==='google' ? (a.adGroup? a.campaignName+' · '+a.adGroup : a.campaignName) : a.campaignName) || 'Anúncio sem nome'; }
function items(opts={}){
  const out=[];
  for(const c of S.data.contents) out.push(Object.assign({},c,{kind:'content'}));
  for(const a of S.data.ads) out.push(Object.assign({},a,{kind:'ad',type:a.platform,title:adTitle(a),channel:a.platform==='google'?'Google Ads':'Meta Ads',caption:a.platform==='meta'?a.copy:'',format:a.format||(a.platform==='google'?(a.campaignType==='Display'?'Google Display':'Texto (Pesquisa)'):'')}));
  return opts.archived? out : out.filter(i=>!i.archived);
}
function isLate(i){ return i.date && i.date < TODAY && !['publicado','agendado'].includes(i.status) && !i.archived; }
function inCurMonth(i){ return i.date && i.date.slice(0,7)===curKey(); }

async function loadSeed(){ return SEED_INLINE; }
function localSave(){ if(S.mode!=='local') return; try{ localStorage.setItem('ph-data',JSON.stringify(S.data)); }catch(e){} }

async function boot(){
  renderAll();
  let db=null;
  try{ if(window.claude && typeof window.claude.use==='function') db = await window.claude.use('db'); }catch(e){ db=null; }
  if(db){
    S.db=db; S.mode='db'; let pending=COLS.length+1;
    const done=()=>{ if(--pending===0){ S.loaded.all=true; scheduleRender(); } };
    COLS.forEach(col=>{
      let first=true;
      db.collection(col).onSnapshot(snap=>{
        S.data[col]=snap.docs.map(d=>Object.assign({id:d.id},clone(d.data())));
        if(first){ first=false; done(); } else scheduleRender();
      }, err=>{ toast('Não foi possível sincronizar ('+col+').','err'); if(first){first=false;done();} });
    });
    let firstS=true;
    db.doc('meta/settings').onSnapshot(s=>{ if(s.exists) S.data.settings=clone(s.data()); if(firstS){firstS=false;done();} else scheduleRender(); }, ()=>{ if(firstS){firstS=false;done();} });
  } else {
    S.mode='local';
    let d=null; try{ d=JSON.parse(localStorage.getItem('ph-data')||'null'); }catch(e){}
    if(!d) d = clone(await loadSeed() || S.data);
    Object.assign(S.data,d); S.loaded.all=true; renderAll();
  }
}
let rq=0;
function scheduleRender(){ if(rq) return; rq=requestAnimationFrame(()=>{ rq=0; renderAll(); }); }

async function put(col,obj){
  const list=S.data[col]; const i=list.findIndex(x=>x.id===obj.id);
  if(i>=0) list.splice(i,1,obj); else list.push(obj);
  renderAll(); localSave();
  if(S.mode==='db'){
    const {id,...body}=obj;
    try{ await S.db.collection(col).doc(id).set(JSON.parse(JSON.stringify(body))); }
    catch(e){ toast(e&&e.code==='invalid_argument'?'Você não tem permissão para editar este painel.':'Não foi possível salvar. Tente de novo.','err'); }
  }
}
async function del(col,id){
  S.data[col]=S.data[col].filter(x=>x.id!==id); renderAll(); localSave();
  if(S.mode==='db'){ try{ await S.db.collection(col).doc(id).delete(); }catch(e){ toast('Não foi possível excluir.','err'); } }
}
async function putSettings(obj){
  S.data.settings=obj; renderAll(); localSave();
  if(S.mode==='db'){ try{ await S.db.doc('meta/settings').set(obj); }catch(e){ toast('Não foi possível salvar.','err'); } }
}
function colOf(i){ return i.kind==='ad'||i.platform? 'ads':'contents'; }
function raw(kind,id){ return (kind==='ad'?S.data.ads:S.data.contents).find(x=>x.id===id); }
function patch(kind,id,changes,msg){
  const o=raw(kind,id); if(!o) return;
  put(kind==='ad'?'ads':'contents', Object.assign(clone(o),changes));
  if(msg) toast(msg);
}
function changeStatus(kind,id,to,note){
  const o=raw(kind,id); if(!o || o.status===to) return;
  const history=(o.history||[]).concat([{date:new Date().toISOString(),from:o.status,to,note:note||''}]);
  patch(kind,id,{status:to,history},'Status: '+ST[to]);
}

function activeFilterChips(){
  const f=S.ui.f; const chips=[];
  const lab={type:v=>TYPES[v]?.label,campaign:v=>camp(v)?.name,channel:v=>v,status:v=>ST[v],owner:v=>member(v)?.name,objective:v=>v,from:v=>'De '+fmtD(v),to:v=>'Até '+fmtD(v)};
  for(const k in f) if(f[k]) chips.push(`<span class="chip blue">${esc(lab[k](f[k])||f[k])}<button data-act="clear-filter" data-k="${k}" aria-label="Remover filtro">${I('i-x')}</button></span>`);
  if(S.ui.q) chips.unshift(`<span class="chip blue">Busca: “${esc(S.ui.q)}”<button data-act="clear-q" aria-label="Limpar busca">${I('i-x')}</button></span>`);
  if(!chips.length) return '';
  return `<div class="active-filters">${chips.join('')}<button class="btn ghost xs" data-act="clear-all-filters">Limpar tudo</button></div>`;
}
function scopeLabel(){ const f=S.ui.f; if(S.ui.q) return 'Resultados em todos os meses'; if(f.from||f.to) return 'Período filtrado'; return MONTHS[S.ui.month]+' '+S.ui.year; }

/* ================= Views ================= */
const VIEWS = {};

VIEWS.dashboard = () => {
  const month=applyFilters(items());
  const contents=month.filter(i=>i.kind==='content'), ads=month.filter(i=>i.kind==='ad');
  const cnt=(arr,fn)=>arr.filter(fn).length;
  const k=[
    ['Conteúdos planejados',month.length,'no mês','all',true],
    ['Em produção',cnt(month,i=>IN_PROD.includes(i.status)),'briefing, criação e ajustes','prod'],
    ['Aguardando aprovação',cnt(month,i=>i.status==='revisao'),'em revisão','revisao'],
    ['Aprovados',cnt(month,i=>['aprovado','agendado'].includes(i.status)),'prontos ou agendados','aprovado'],
    ['Publicados',cnt(month,i=>i.status==='publicado'),'no ar','publicado'],
    ['Anúncios em produção',cnt(ads,i=>!DONE.includes(i.status)),ads.length+' anúncios no mês','ads']
  ];
  const stages=[
    ['Planejados','ideia',i=>i.status==='ideia','ideia'],
    ['Em briefing','briefing',i=>['briefing','aguardando'].includes(i.status),'briefing'],
    ['Em criação','criacao',i=>i.status==='criacao','criacao'],
    ['Em revisão','revisao',i=>['revisao','ajustes'].includes(i.status),'revisao'],
    ['Aprovados','aprovado',i=>['aprovado','agendado'].includes(i.status),'aprovado'],
    ['Publicados','publicado',i=>i.status==='publicado','publicado']
  ].map(s=>({label:s[0],color:s[1],n:cnt(month,s[2]),status:s[3]}));
  const total=month.length||1;
  const pct=Math.round(100*cnt(month,i=>DONE.includes(i.status))/total);
  const mix=[['Posts',cnt(contents,i=>i.type==='estatico')],['Carrosséis',cnt(contents,i=>i.type==='carrossel')],['Reels',cnt(contents,i=>i.type==='reel')],['Stories',cnt(contents,i=>i.type==='story')],['Anúncios',ads.length],['Publicados',cnt(month,i=>i.status==='publicado')],['Pendentes',cnt(month,i=>!DONE.includes(i.status))]];

  const upcoming=items().filter(i=>i.date>=TODAY && i.status!=='publicado').sort(byDate).slice(0,7);
  const P=pendings();
  const tabs=[['late','Atrasados'],['art','Aguardam arte'],['approval','Aguardam aprovação'],['caption','Aguardam legenda'],['link','Sem link da arte']];
  const cur=P[S.ui.pend]||[];
  const camps=S.data.campaigns.filter(c=>c.status==='ativa'||c.status==='planejamento').map(c=>{ const its=items().filter(i=>i.campaignId===c.id); const d=its.filter(i=>DONE.includes(i.status)).length; return {c,n:its.length,d}; }).filter(x=>x.n).slice(0,5);

  return `<div class="page">
    <div class="page-head">
      <div><div class="eyebrow">Visão geral · ${esc(scopeLabel())}</div><h1>Produção de ${esc(MONTHS[S.ui.month].toLowerCase())}</h1>
      <p class="sub">${month.length} peças no mês · ${pct}% aprovadas ou publicadas · ${P.late.length} ${P.late.length===1?'atrasada':'atrasadas'}</p></div>
      <div class="toolbar">${activeFilterChips()}<button class="btn" data-act="nav" data-view="calendar">${I('i-cal')}Ver calendário</button></div>
    </div>
    <div class="kpis">${k.map(([l,v,f,go,hero])=>`<button class="card kpi${hero?' hero':''}" data-act="kpi" data-go="${go}"><span class="k-label">${esc(l)}</span><span class="k-val mono">${v}</span><span class="k-foot">${esc(f)}</span></button>`).join('')}</div>
    <section class="card card-pad">
      <div class="sec-h" style="margin-bottom:14px"><h2>Produção deste mês</h2><span class="muted mono" style="font-size:12.5px">${month.length} peças</span></div>
      <div class="prod-bar">${stages.map(s=>s.n?`<span style="flex-grow:${s.n};background:var(--s-${s.color})" title="${esc(s.label)}: ${s.n}"></span>`:'').join('')||'<span style="flex-grow:1"></span>'}</div>
      <div class="prod-legend">${stages.map(s=>`<button data-act="goto-status" data-s="${s.status}"><span class="pl-top"><i style="--c:var(--s-${s.color})"></i>${esc(s.label)}</span><b class="mono">${s.n}</b></button>`).join('')}</div>
      <div class="mix">${mix.map(([l,n])=>`<div><b class="mono">${n}</b><span>${l}</span></div>`).join('')}</div>
    </section>
    <div class="dash-cols">
      <section class="card">
        <div class="card-head"><h2>Pendências</h2><button class="btn ghost sm" data-act="nav" data-view="production">Ver produção ${I('i-arrow')}</button></div>
        <div class="pend-tabs">${tabs.map(([k,l])=>`<button class="${S.ui.pend===k?'on':''} ${k==='late'&&P.late.length?'late':''}" data-act="pend-tab" data-k="${k}">${l}<b>${P[k].length}</b></button>`).join('')}</div>
        <div class="pend-list">${cur.length?cur.slice(0,8).map(i=>`<button class="pend-row" data-act="open" data-kind="${i.kind}" data-id="${esc(i.id)}">${typeIco(i.type)}<div class="grow"><div class="t">${esc(i.title)}</div><div class="muted" style="font-size:12px">${esc(camp(i.campaignId)?.name||'Sem campanha')} · ${esc(member(i.owner)?.name||'—')}</div></div>${isLate(i)?`<span class="chip late">${I('i-clock')}${fmtD(i.date)}</span>`:`<span class="mono muted" style="font-size:12px">${fmtD(i.date)}</span>`}${statusEl(i.status)}</button>`).join('')+(cur.length>8?`<div class="muted" style="padding:8px 12px;font-size:12.5px">e mais ${cur.length-8}</div>`:''):emptyState('Nada pendente aqui.')}</div>
      </section>
      <div class="grid">
        <section class="card">
          <div class="card-head"><h2>Próximos conteúdos</h2><button class="btn ghost sm" data-act="nav-cal-list">Lista completa ${I('i-arrow')}</button></div>
          <div class="up-list">${upcoming.length?upcoming.map(i=>`<button class="up-item" data-act="open" data-kind="${i.kind}" data-id="${esc(i.id)}">${datebox(i.date)}<div style="min-width:0"><div class="up-title">${esc(i.title)}</div><div class="up-meta">${typeEl(i.type)}<span class="muted" style="font-size:12px">${esc(i.channel||'')}</span></div></div>${statusEl(i.status)}</button>`).join(''):emptyState('Nenhum conteúdo agendado a partir de hoje.')}</div>
        </section>
        <section class="card">
          <div class="card-head"><h2>Campanhas em produção</h2><button class="btn ghost sm" data-act="nav" data-view="campaigns">Todas ${I('i-arrow')}</button></div>
          <div class="camp-mini">${camps.length?camps.map(x=>`<button data-act="open-campaign" data-id="${esc(x.c.id)}"><div class="row"><b>${esc(x.c.name)}</b><span class="muted mono">${x.d}/${x.n} prontas</span></div><div class="bar"><span style="width:${Math.round(100*x.d/x.n)}%"></span></div></button>`).join(''):emptyState('Nenhuma campanha ativa.')}</div>
        </section>
      </div>
    </div>
  </div>`;
};

function pendings(){
  const all=items(); const m=all.filter(inCurMonth);
  return {
    late: all.filter(isLate).sort(byDate),
    art: m.filter(i=>['aguardando','criacao','ajustes'].includes(i.status)).sort(byDate),
    approval: m.filter(i=>i.status==='revisao').sort(byDate),
    caption: m.filter(needsCaption).sort(byDate),
    link: m.filter(i=>(DONE.includes(i.status)||i.status==='revisao') && !i.artLink && !(i.kind==='ad'&&i.platform==='google'&&i.campaignType==='Pesquisa')).sort(byDate)
  };
}
function notifications(){
  const all=items(); const out=[];
  all.filter(isLate).forEach(i=>out.push({i,cls:'late',ic:'i-alert',t:'Atrasado: '+i.title,s:'Previsto para '+fmtD(i.date)+' · '+ST[i.status]}));
  const soon=new Date(today); soon.setDate(soon.getDate()+3); const soonS=iso(soon);
  all.filter(i=>i.date>=TODAY && i.date<=soonS && !DONE.includes(i.status)).forEach(i=>out.push({i,cls:'soon',ic:'i-clock',t:'Prazo próximo: '+i.title,s:(i.date===TODAY?'Hoje':fmtDL(i.date))+' · '+ST[i.status]}));
  all.filter(i=>i.status==='revisao' && !isLate(i)).forEach(i=>out.push({i,cls:'rev',ic:'i-eye',t:'Aguardando sua aprovação',s:i.title}));
  return out;
}

/* ---------- Calendário ---------- */
VIEWS.calendar = () => {
  const list=applyFilters(items(),{month:S.ui.cal!=='week'}).sort(byDate);
  const head=`<div class="page-head"><div><div class="eyebrow">Calendário de conteúdo</div><h1>${S.ui.cal==='week'?weekLabel():esc(MONTHS[S.ui.month]+' '+S.ui.year)}</h1></div>
    <div class="toolbar">${activeFilterChips()}
      ${S.ui.cal==='week'?`<div class="month-nav"><button data-act="week-prev" aria-label="Semana anterior">${I('i-chev-l')}</button><button class="m-label" data-act="week-today" style="min-width:80px">Hoje</button><button data-act="week-next" aria-label="Próxima semana">${I('i-chev-r')}</button></div>`:''}
      <div class="seg"><button class="${S.ui.cal==='month'?'on':''}" data-act="cal-view" data-v="month">${I('i-cal')}Mês</button><button class="${S.ui.cal==='week'?'on':''}" data-act="cal-view" data-v="week">${I('i-kanban')}Semana</button><button class="${S.ui.cal==='list'?'on':''}" data-act="cal-view" data-v="list">${I('i-list')}Lista</button></div></div></div>
    <div class="legend">${['estatico','carrossel','reel','story','meta','google'].map(t=>`<span>${typeIco(t)}${TYPES[t].short}</span>`).join('')}</div>`;
  let body='';
  if(S.ui.cal==='month'){
    const first=new Date(S.ui.year,S.ui.month,1); const start=new Date(first); start.setDate(1-first.getDay());
    const last=new Date(S.ui.year,S.ui.month+1,0); const cells=Math.ceil((first.getDay()+last.getDate())/7)*7;
    const by={}; (S.ui.q||S.ui.f.from||S.ui.f.to? applyFilters(items(),{month:false}) : list).forEach(i=>{(by[i.date]=by[i.date]||[]).push(i);});
    let h='';
    for(let n=0;n<cells;n++){ const d=new Date(start); d.setDate(start.getDate()+n); const k=iso(d); const out=d.getMonth()!==S.ui.month; const evs=(by[k]||[]);
      h+=`<div class="cal-cell${out?' out':''}" data-drop-date="${k}"><div class="cal-day${k===TODAY?' today':''}"><span>${d.getDate()}</span><button class="cal-add" data-act="new-content" data-date="${k}" aria-label="Novo conteúdo em ${fmtD(k)}">${I('i-plus')}</button></div>${evs.map(evChip).join('')}</div>`; }
    body=`<section class="card cal"><div class="cal-head">${WD.map(w=>`<div>${w}</div>`).join('')}</div><div class="cal-grid">${h}</div></section>`;
  } else if(S.ui.cal==='week'){
    const ws=weekStart(); const all=applyFilters(items(),{month:false});
    let h=''; for(let n=0;n<7;n++){ const d=new Date(ws); d.setDate(ws.getDate()+n); const k=iso(d); const evs=all.filter(i=>i.date===k).sort(byDate);
      h+=`<div class="week-col${k===TODAY?' today':''}" data-drop-date="${k}"><div class="week-col-h"><span>${WD[d.getDay()]}</span><b class="mono">${d.getDate()}</b></div>${evs.map(i=>`<div class="wcard" draggable="true" data-drag="${i.kind}:${esc(i.id)}" data-act="open" data-kind="${i.kind}" data-id="${esc(i.id)}"><div class="meta"><span class="mono">${fmtD(i.date)}</span>${typeEl(i.type)}</div><div class="t">${esc(i.title)}</div><div class="meta"><span>${esc(i.channel||'')}</span>${statusEl(i.status)}</div></div>`).join('')}<button class="btn ghost xs" data-act="new-content" data-date="${k}" style="align-self:flex-start">${I('i-plus')}Adicionar</button></div>`; }
    body=`<div class="week">${h}</div>`;
  } else {
    const by={}; list.forEach(i=>{(by[i.date||'—']=by[i.date||'—']||[]).push(i);});
    const keys=Object.keys(by).sort();
    body=`<section class="card">${keys.length?keys.map(k=>{const d=pd(k);return `<div class="list-day"><div class="ld">${d?d.getDate()+' '+MON3[d.getMonth()]:'Sem data'}<small>${d?WD[d.getDay()]:''}</small></div><div class="list-items">${by[k].map(i=>`<button class="lrow" data-act="open" data-kind="${i.kind}" data-id="${esc(i.id)}"><span class="t">${esc(i.title)}</span>${typeEl(i.type)}<span class="muted" style="font-size:12.5px">${esc(i.channel||'')}</span>${statusEl(i.status)}</button>`).join('')}</div></div>`;}).join(''):emptyState('Nenhum conteúdo neste período.','<button class="btn primary sm" data-act="new-content">'+I('i-plus')+'Novo conteúdo</button>')}</section>`;
  }
  return `<div class="page">${head}${body}</div>`;
};
function evChip(i){ return `<div class="ev${isLate(i)?' late':''}${i.status==='publicado'?' done':''}" draggable="true" data-drag="${i.kind}:${esc(i.id)}" data-act="open" data-kind="${i.kind}" data-id="${esc(i.id)}" title="${esc(i.title)} · ${esc(TYPES[i.type]?.label||'')} · ${esc(i.channel||'')} · ${esc(ST[i.status])}">${typeIco(i.type)}<span class="ev-t">${esc(i.title)}</span><span class="sd" style="--c:var(--s-${i.status})"></span></div>`; }
function weekStart(){ if(!S.ui.weekStart){ const base = (today.getMonth()===S.ui.month && today.getFullYear()===S.ui.year)? new Date(today) : new Date(S.ui.year,S.ui.month,1); base.setDate(base.getDate()-base.getDay()); S.ui.weekStart=iso(base); } return pd(S.ui.weekStart); }
function weekLabel(){ const a=weekStart(); const b=new Date(a); b.setDate(a.getDate()+6); return a.getDate()+' '+MON3[a.getMonth()]+' – '+b.getDate()+' '+MON3[b.getMonth()]+' '+b.getFullYear(); }

  let list=applyFilters(items({archived:S.ui.showArchived}));

  list.sort(byDate);
  return `<div class="page">
    <div class="page-head"><div><div class="eyebrow">${esc(scopeLabel())}</div><h1>${S.ui.showArchived?'Conteúdos arquivados':'Conteúdos'}</h1><p class="sub">${list.length} ${list.length===1?'item':'itens'} · posts, carrosséis, Reels, Stories e anúncios</p></div>
      <div class="toolbar">${activeFilterChips()}<button class="btn ${S.ui.showArchived?'soft':''}" data-act="toggle-archived">${I('i-archive')}${S.ui.showArchived?'Ver ativos':'Arquivados'}</button><button class="btn primary" data-act="new-content">${I('i-plus')}Novo conteúdo</button></div></div>
    <section class="card"><div class="table-wrap"><table>
      <thead><tr><th>Conteúdo</th><th>Tipo</th><th>Canal</th><th>Data</th><th>Resp.</th><th>Status</th><th>Arte</th><th>Legenda</th><th></th></tr></thead>
      <tbody>${list.map(i=>`<tr data-act="open" data-kind="${i.kind}" data-id="${esc(i.id)}"><td><div class="t">${esc(i.title)}</div><div class="s">${esc(camp(i.campaignId)?.name||'Sem campanha')}${i.priority==='alta'?' · <span style="color:var(--danger)">Prioridade alta</span>':''}</div></td>
        <td>${typeEl(i.type)}</td><td class="muted">${esc(i.channel||'')}</td>
        <td class="mono">${isLate(i)?`<span class="chip late">${fmtD(i.date)}</span>`:fmtD(i.date)}</td><td>${avatar(i.owner)}</td><td>${statusEl(i.status)}</td>
        <td>${i.artLink?`<a class="link-icon" href="${esc(safeUrl(i.artLink))}" target="_blank" rel="noopener" data-stop>${I('i-ext')}Abrir</a>`:'<span class="muted">—</span>'}</td>
        <td>${i.kind==='ad'?'<span class="muted">—</span>':`<span class="tick ${hasCaption(i)?'yes':'no'}">${I(hasCaption(i)?'i-check':'i-x')}</span>`}</td>
        <td><div class="row-actions"><button class="btn ghost xs" data-act="dup" data-kind="${i.kind}" data-id="${esc(i.id)}" title="Duplicar">${I('i-dup')}</button><button class="btn ghost xs" data-act="archive" data-kind="${i.kind}" data-id="${esc(i.id)}" title="${i.archived?'Restaurar':'Arquivar'}">${I('i-archive')}</button></div></td></tr>`).join('')}</tbody>
    </table></div>${list.length?'':emptyState(S.ui.showArchived?'Nenhum conteúdo arquivado neste período.':'Nenhum conteúdo encontrado. Ajuste os filtros ou crie um novo.')}</section></div>`;
};

/* ---------- Anúncios ---------- */

  const tab=S.ui.adsTab;
  const all=applyFilters(items()).filter(i=>i.kind==='ad');
  const list=all.filter(i=>i.platform===tab).sort(byDate);
  const n=p=>all.filter(i=>i.platform===p).length;
  return `<div class="page">
    <div class="page-head"><div><div class="eyebrow">${esc(scopeLabel())}</div><h1>Anúncios</h1><p class="sub">Criativos e copies para Meta Ads e Google Ads. Duplique para criar variações.</p></div>
    <div class="toolbar">${activeFilterChips()}<div class="seg"><button class="${tab==='meta'?'on':''}" data-act="ads-tab" data-v="meta">${typeIco('meta')}Meta Ads <span class="mono muted">${n('meta')}</span></button><button class="${tab==='google'?'on':''}" data-act="ads-tab" data-v="google">${typeIco('google')}Google Ads <span class="mono muted">${n('google')}</span></button></div>
    <button class="btn primary" data-act="new-ad" data-p="${tab}">${I('i-plus')}Novo anúncio</button></div></div>
    ${list.length?`<div class="ads-grid">${list.map(adCard).join('')}</div>`:`<section class="card">${emptyState('Nenhum anúncio '+(tab==='meta'?'Meta':'Google')+' neste período.','<button class="btn primary sm" data-act="new-ad" data-p="'+tab+'">'+I('i-plus')+'Novo anúncio</button>')}</section>`}

function adPreview(a){
  if(a.platform==='google') return `<div class="ad-preview"><span class="gp-url">Patrocinado · ${esc(host(safeUrl(a.url))||'seusite.com.br')}${a.path?' › '+esc(a.path.split('/').join(' › ')):''}</span><span class="gp-t">${esc([a.t1,a.t2,a.t3].filter(Boolean).join(' | ')||'Títulos do anúncio')}</span><span class="gp-d">${esc([a.d1,a.d2].filter(Boolean).join(' ')||'Descrições do anúncio')}</span></div>`;
  return `<div class="ad-preview"><span class="mp-copy">${esc(a.copy||'Copy principal do anúncio')}</span><div class="mp-foot"><div style="min-width:0"><div class="gp-url">${esc(host(safeUrl(a.url))||'')}</div><b>${esc(a.headline||'Headline')}</b></div><span>${esc(a.cta||'Saiba mais')}</span></div></div>`;
}
function adCard(a){
  return `<article class="card ad-card"><div class="ad-top" data-act="open" data-kind="ad" data-id="${esc(a.id)}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="muted mono" style="font-size:12px">${fmtD(a.date)} · ${esc(camp(a.campaignId)?.name||'Sem campanha')}</span>${statusEl(a.status,true)}</div><div class="t">${esc(a.title)}</div><div class="muted" style="font-size:12px">${esc(a.platform==='google'?(a.campaignType||'')+' · '+(a.campaignName||''):(a.objective||'')+' · '+(a.format||''))}</div></div>
    ${adPreview(a)}
    <div class="ad-foot"><div style="display:flex;gap:4px">${a.artLink?`<a class="btn xs soft" href="${esc(safeUrl(a.artLink))}" target="_blank" rel="noopener">${I('i-ext')}Abrir arte</a>`:''}<button class="btn ghost xs" data-act="copy-ad" data-id="${esc(a.id)}">${I('i-copy')}Copiar copy</button></div><div style="display:flex;gap:2px"><button class="btn ghost xs" data-act="dup" data-kind="ad" data-id="${esc(a.id)}" title="Duplicar">${I('i-dup')}Duplicar</button><button class="btn ghost xs" data-act="edit" data-kind="ad" data-id="${esc(a.id)}" title="Editar">${I('i-edit')}</button></div></div></article>`;
}

/* ---------- Campanhas ---------- */
VIEWS.campaigns = () => {
  if(S.ui.campaign && camp(S.ui.campaign)) return campaignDetail(camp(S.ui.campaign));
  const q=S.ui.q.toLowerCase();
  const list=S.data.campaigns.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.description||'').toLowerCase().includes(q)).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  return `<div class="page"><div class="page-head"><div><div class="eyebrow">Campanhas</div><h1>Campanhas</h1><p class="sub">Cada campanha reúne seus conteúdos e anúncios.</p></div><button class="btn primary" data-act="new-campaign">${I('i-plus')}Nova campanha</button></div>
    <div class="camp-grid">${list.map(c=>{ const its=items().filter(i=>i.campaignId===c.id); const d=its.filter(i=>DONE.includes(i.status)).length; const tc={}; its.forEach(i=>tc[i.type]=(tc[i.type]||0)+1);

function libCard(i){

}

/* ---------- Legendas ---------- */
function captionEntries(){
  const out=[];
  for(const i of items()){
    if(i.kind==='content' && i.caption) out.push({src:'content',kind:'content',id:i.id,title:i.title,text:i.caption+(i.cta?'\n\n'+i.cta:'')+(i.hashtags?'\n\n'+i.hashtags:''),platform:i.channel||'Instagram',type:i.type,campaignId:i.campaignId,month:(i.date||'').slice(0,7)});
    if(i.kind==='ad' && i.platform==='meta' && i.copy) out.push({src:'ad',kind:'ad',id:i.id,title:i.title,text:i.copy+(i.headline?'\n\nHeadline: '+i.headline:'')+(i.description?'\nDescrição: '+i.description:''),platform:'Meta Ads',type:'meta',campaignId:i.campaignId,month:(i.date||'').slice(0,7)});
    if(i.kind==='ad' && i.platform==='google' && (i.t1||i.d1)) out.push({src:'ad',kind:'ad',id:i.id,title:i.title,text:[i.t1,i.t2,i.t3].filter(Boolean).map((t,n)=>'Título '+(n+1)+': '+t).join('\n')+'\n'+[i.d1,i.d2].filter(Boolean).map((t,n)=>'Descrição '+(n+1)+': '+t).join('\n'),platform:'Google Ads',type:'google',campaignId:i.campaignId,month:(i.date||'').slice(0,7)});
  }
  for(const c of S.data.captions) out.push({src:'caption',kind:'caption',id:c.id,title:c.title,text:c.text,platform:c.platform,type:c.type,campaignId:c.campaignId,month:c.month||''});
  return out;
}

/* ---------- Relatórios ---------- */
VIEWS.reports = () => {
  const all=items(); const y=S.ui.year; const scopeYear=S.ui.repScope==='year';
  const scoped=all.filter(i=>i.date && (scopeYear? i.date.slice(0,4)===String(y) : inCurMonth(i)));
  const perMonth=MONTHS.map((m,ix)=>{ const its=all.filter(i=>i.date&&i.date.slice(0,7)===mkey(y,ix)); return {pub:its.filter(i=>i.status==='publicado').length,ok:its.filter(i=>['aprovado','agendado'].includes(i.status)).length,rest:its.filter(i=>!DONE.includes(i.status)).length,total:its.length}; });
  const max=Math.max(1,...perMonth.map(p=>p.total));
  const byType=Object.keys(TYPES).map(t=>[TYPES[t].short,scoped.filter(i=>i.type===t).length]).filter(x=>x[1]);
  const byCamp=S.data.campaigns.map(c=>[c.name,scoped.filter(i=>i.campaignId===c.id).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
  const maxT=Math.max(1,...byType.map(x=>x[1])), maxC=Math.max(1,...byCamp.map(x=>x[1]));
  const durs=scoped.map(i=>{ const h=i.history||[]; const b=h.find(x=>x.to==='briefing'); const a=h.find(x=>x.to==='aprovado'); return b&&a? (new Date(a.date)-new Date(b.date))/86400000 : null; }).filter(x=>x!=null&&x>=0);
  const avg=durs.length? (durs.reduce((s,x)=>s+x,0)/durs.length) : null;
  const produced=scoped.filter(i=>DONE.includes(i.status)).length;
  const pub=scoped.filter(i=>i.status==='publicado').length; const late=scoped.filter(isLate).length;
  return `<div class="page">
    <div class="page-head"><div><div class="eyebrow">Relatório de produção</div><h1>${scopeYear?'Produção em '+y:'Produção de '+esc(MONTHS[S.ui.month].toLowerCase())}</h1></div><div class="seg"><button class="${scopeYear?'on':''}" data-act="rep-scope" data-v="year">Ano</button><button class="${!scopeYear?'on':''}" data-act="rep-scope" data-v="month">Mês selecionado</button></div></div>
    <div class="stat-row">
      <div class="card stat"><small>Peças produzidas</small><b class="mono">${produced}</b><span>aprovadas, agendadas ou publicadas</span></div>
      <div class="card stat"><small>Tempo médio briefing → aprovação</small><b class="mono">${avg==null?'—':avg.toFixed(1).replace('.',',')+' d'}</b><span>${durs.length} peças com histórico completo</span></div>
      <div class="card stat"><small>Publicados</small><b class="mono">${pub}</b><span>de ${scoped.length} planejados</span></div>
      <div class="card stat"><small>Atrasados</small><b class="mono" style="${late?'color:var(--danger)':''}">${late}</b><span>prazo vencido sem publicação</span></div>
    </div>
    <section class="card"><div class="card-head"><h2>Peças por mês · ${y}</h2><div class="legend"><span><i style="--c:var(--s-publicado)"></i>Publicadas</span><span><i style="--c:var(--blue)"></i>Aprovadas/agendadas</span><span><i style="--c:var(--line-2)"></i>Em andamento</span></div></div>
      <div class="vbars">${perMonth.map((p,ix)=>`<div class="vbar${ix===S.ui.month?' cur':''}"><em>${p.total||''}</em><div class="stack" style="height:${Math.round(150*p.total/max)}px">${p.pub?`<span style="height:${100*p.pub/p.total}%;background:var(--s-publicado)"></span>`:''}${p.ok?`<span style="height:${100*p.ok/p.total}%;background:var(--blue)"></span>`:''}${p.rest?`<span style="height:${100*p.rest/p.total}%;background:var(--line-2)"></span>`:''}</div><small>${MON3[ix]}</small></div>`).join('')}</div></section>
    <div class="rep-grid">
      <section class="card"><div class="card-head"><h2>Por tipo</h2></div><div class="hbars">${byType.length?byType.map(([l,n])=>`<div class="hbar"><span>${esc(l)}</span><div class="track"><span style="width:${100*n/maxT}%"></span></div><b>${n}</b></div>`).join(''):emptyState('Sem dados no período.')}</div></section>
      <section class="card"><div class="card-head"><h2>Por campanha</h2></div><div class="hbars">${byCamp.length?byCamp.map(([l,n])=>`<div class="hbar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(l)}">${esc(l)}</span><div class="track"><span style="width:${100*n/maxC}%;background:var(--ink-2)"></span></div><b>${n}</b></div>`).join(''):emptyState('Sem dados no período.')}</div></section>
    </div>
  </div>`;
};
