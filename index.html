/* ================= Drawer ================= */
function openDrawer(kind,id,designer){
  S.drawer={kind,id}; S.designer=!!designer; S.dtab='geral';
  renderDrawer(true);
  document.getElementById('drawer').classList.add('on'); document.getElementById('scrim').classList.add('on');
  document.getElementById('drawer').setAttribute('aria-hidden','false');
}
function closeDrawer(){
  S.drawer=null; document.getElementById('drawer').classList.remove('on'); document.getElementById('scrim').classList.remove('on');
  document.getElementById('drawer').setAttribute('aria-hidden','true');
}
function renderDrawer(force){
  if(!S.drawer) return;
  const el=document.getElementById('drawer');
  const ae=document.activeElement;
  if(!force && ae && el.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
  const i=items({archived:true}).find(x=>x.kind===S.drawer.kind && x.id===S.drawer.id);
  if(!i){ closeDrawer(); return; }
  const scroll=el.querySelector('.d-body')?.scrollTop||0;
  el.innerHTML = S.designer? designerDrawer(i) : fullDrawer(i);
  const b=el.querySelector('.d-body'); if(b && !force) b.scrollTop=scroll;
  const ta=el.querySelector('#capText'); if(ta) updateCapCount();
}
function stepper(i){
  const at=FLOW_OF[i.status];
  return `<div class="stepper">${FLOW.map(([k,l],ix)=>{ let c=''; if(ix===at) c=i.status==='ajustes'?'adj cur':'cur'; else if(ix<at && !(k==='ajustes' && i.status!=='ajustes' && !(i.history||[]).some(h=>h.to==='ajustes'))) c='done'; return `<div class="${c}"><i></i><span>${l}</span></div>`; }).join('')}</div>`;
}
function statusControls(i){
  const nx=NEXT[i.status];
  return `<div class="status-ctl">${nx?`<button class="btn primary sm" data-act="advance-note" data-kind="${i.kind}" data-id="${esc(i.id)}">${esc(NEXT_LABEL[nx]||ST[nx])} ${I('i-arrow')}</button>`:''}
    ${i.status==='revisao'?`<button class="btn sm danger" data-act="request-adj" data-kind="${i.kind}" data-id="${esc(i.id)}">Solicitar ajustes</button>`:''}
    <select class="sel" id="stSel" aria-label="Alterar status">${options(STATUSES,i.status)}</select>
    <input id="stNote" placeholder="Observação da mudança (opcional)"></div>`;
}
function artBox(i){
  const u=safeUrl(i.artLink);
  if(u) return `<div class="art-box">${I('i-image')}<div class="grow"><b>Arte final / Drive</b><div class="u">${esc(host(u))} · ${esc(u)}</div></div><a class="btn open-art" href="${esc(u)}" target="_blank" rel="noopener">${I('i-ext')}ABRIR ARTE</a></div>`;
  return `<div class="art-box missing">${I('i-alert')}<div class="grow"><b>Sem link da arte</b><div class="u">Cole o link do Google Drive, OneDrive ou Dropbox.</div></div><form class="inline-add" data-form="art-link" style="flex:1;min-width:220px"><input id="artLinkIn" type="url" placeholder="https://drive.google.com/…" required><button class="btn sm primary" type="submit">Salvar</button></form></div>`;
}
function fullDrawer(i){
  const c=camp(i.campaignId); const isAd=i.kind==='ad';
  const tabs=isAd?[['geral','Anúncio'],['hist','Comentários e histórico']]:[['geral','Visão geral'],['brief','Briefing'],['legenda','Legenda'],['hist','Comentários e histórico']];
  let body='';
  if(S.dtab==='geral' && !isAd) body=`
    <div class="kv"><div><small>Tipo</small><span>${esc(TYPES[i.type]?.label||'')}</span></div><div><small>Canal</small><span>${esc(i.channel||'—')}</span></div><div><small>Publicação</small><span>${fmtDL(i.date)}${isLate(i)?' · <span style="color:var(--danger)">atrasado</span>':''}</span></div>
    <div><small>Objetivo</small><span>${esc(i.objective==='Outro'&&i.objectiveOther?i.objectiveOther:i.objective||'—')}</span></div><div><small>Formato</small><span>${esc(i.customSize||i.format||'—')}</span></div><div><small>Responsável</small><span>${esc(member(i.owner)?.name||'—')}</span></div>
    <div><small>Campanha</small><span>${esc(c?.name||'—')}</span></div><div><small>Prioridade</small><span>${esc(PRIORITIES[i.priority]||'—')}</span></div><div><small>Legenda</small><span>${hasCaption(i)?'Escrita':'Pendente'}</span></div></div>
    ${i.artText?`<div class="sec"><div class="sec-h"><h3>Texto que aparece na arte</h3></div><div class="textblock art">${esc(i.artText)}</div></div>`:''}
    <div class="sec"><div class="sec-h"><h3>Anexos e versões</h3></div>${attachList(i)}</div>`;
  if(S.dtab==='brief') body=`
    <div class="sec"><div class="sec-h"><h3>Orientações para o designer</h3><button class="btn ghost xs" data-act="edit" data-kind="${i.kind}" data-id="${esc(i.id)}">${I('i-edit')}Editar</button></div><div class="textblock">${esc(i.brief||'Sem orientações ainda.')}</div></div>
    ${i.artText?`<div class="sec"><div class="sec-h"><h3>Texto que aparece na arte</h3></div><div class="textblock art">${esc(i.artText)}</div></div>`:''}

  return `<div class="d-head">
    <div class="d-bar"><div style="display:flex;gap:8px;align-items:center">${typeEl(i.type,true)}${i.archived?'<span class="chip">Arquivado</span>':''}</div>
      <div style="display:flex;gap:2px;flex-wrap:wrap">${!isAd?`<button class="btn ghost sm" data-act="designer-toggle">${I('i-pen')}Modo Designer</button>`:''}<button class="btn ghost sm" data-act="edit" data-kind="${i.kind}" data-id="${esc(i.id)}" title="Editar">${I('i-edit')}</button><button class="btn ghost sm" data-act="dup" data-kind="${i.kind}" data-id="${esc(i.id)}" title="Duplicar">${I('i-dup')}</button><button class="btn ghost sm" data-act="archive" data-kind="${i.kind}" data-id="${esc(i.id)}" title="${i.archived?'Restaurar':'Arquivar'}">${I('i-archive')}</button><button class="btn ghost sm" data-act="close-drawer" aria-label="Fechar">${I('i-x')}</button></div></div>
    <h2 class="d-title">${esc(i.title)}</h2>
    <div class="d-sub">${statusEl(i.status,true)}<span>${esc(c?.name||'Sem campanha')}</span><span>·</span><span>${esc(i.channel||'')}</span><span>·</span><span class="mono">${fmtD(i.date)}</span><span style="display:inline-flex;align-items:center;gap:6px">${avatar(i.owner)}${esc(member(i.owner)?.name||'')}</span></div>
    ${stepper(i)}${statusControls(i)}
    <div class="dtabs">${tabs.map(([k,l])=>`<button class="${S.dtab===k?'on':''}" data-act="dtab" data-k="${k}">${l}</button>`).join('')}</div>
  </div><div class="d-body">${S.dtab==='geral'?artBox(i):''}${body}</div>`;
}
function adDetail(a){
  const g=a.platform==='google';
  const rows=g?[['Campanha',a.campaignName],['Grupo de anúncios',a.adGroup],['Tipo de campanha',a.campaignType],['Título 1',a.t1],['Título 2',a.t2],['Título 3',a.t3],['Descrição 1',a.d1],['Descrição 2',a.d2],['URL final',a.url],['Caminho de exibição',a.path],['Extensões / observações',a.extensions]]
    :[['Nome da campanha',a.campaignName],['Nome do anúncio',a.adName],['Objetivo',a.objective],['Público',a.audience],['Praça / região',a.region],['Formato',a.format],['Copy principal',a.copy],['Headline',a.headline],['Descrição',a.description],['CTA',a.cta],['Link de destino',a.url]];
  return `<div class="sec"><div class="sec-h"><h3>Prévia</h3><button class="btn ghost xs" data-act="copy-ad" data-id="${esc(a.id)}">${I('i-copy')}Copiar textos</button></div>${adPreview(a).replace('class="ad-preview"','class="ad-preview" style="margin:0"')}</div>
  <div class="sec"><div class="sec-h"><h3>Campos</h3><button class="btn ghost xs" data-act="edit" data-kind="ad" data-id="${esc(a.id)}">${I('i-edit')}Editar</button></div>
  <div class="kv" style="grid-template-columns:minmax(0,1fr)">${rows.map(([l,v])=>`<div style="display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px"><small style="margin:0">${l}</small><span style="font-weight:400">${/^URL|Link/.test(l)&&safeUrl(v)?`<a href="${esc(safeUrl(v))}" target="_blank" rel="noopener">${esc(v)}</a>`:esc(v||'—')}${g&&/^Título/.test(l)&&v?` <span class="mono muted" style="font-size:11px">${v.length}/30</span>`:''}${g&&/^Descrição/.test(l)&&v?` <span class="mono muted" style="font-size:11px">${v.length}/90</span>`:''}</span></div>`).join('')}</div></div>
  ${a.notes?`<div class="sec"><div class="sec-h"><h3>Observações para o designer</h3></div><div class="textblock">${esc(a.notes)}</div></div>`:''}`;
}
function refList(i){
  const refs=i.references||[];

  <form class="inline-add" data-form="add-ref"><input id="refIn" placeholder="Cole um link de referência, post ou concorrente" required><button class="btn sm" type="submit">${I('i-plus')}Adicionar referência</button></form></div>`;
}
function attachList(i){
  const at=i.attachments||[];
  return `<div class="reflist">${at.map((r,ix)=>{const u=safeUrl(r.url);return `<div class="ref">${I('i-link')}<b style="font-size:12.5px;white-space:nowrap">${esc(r.label||'Anexo')}</b>${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(host(u))}</a>`:`<span style="flex:1"></span>`}<button class="btn ghost xs" data-act="del-att" data-ix="${ix}" aria-label="Remover anexo">${I('i-x')}</button></div>`;}).join('')}
  <form class="inline-add" data-form="add-att"><input id="attLabel" placeholder="Nome (ex.: V2, fotos, logo)" style="max-width:170px"><input id="attUrl" placeholder="Link" required><button class="btn sm" type="submit">${I('i-plus')}Anexar</button></form></div>`;
}
function captionEditor(i){
  return `<div class="sec"><div class="sec-h"><h3>Legenda · Instagram / Facebook</h3><button class="btn soft xs" data-act="copy-caption">${I('i-copy')}Copiar legenda</button></div>
  <form data-form="caption" class="grid" style="gap:14px">
  <div class="cap-editor"><div class="cap-tools">${EMOJIS.map(e=>`<button type="button" class="emo" data-act="emoji" data-e="${e}" aria-label="Inserir ${e}">${e}</button>`).join('')}<span class="sep"></span><button type="button" class="btn ghost xs" data-act="ins-cta">+ CTA</button><button type="button" class="btn ghost xs" data-act="ins-tags">+ Hashtags</button></div>
  <textarea id="capText" placeholder="Escreva a legenda…">${esc(i.caption||'')}</textarea><div class="cap-count"><span id="capCount"></span><span id="tagCount"></span></div></div>

  <div class="f"><label for="capNotes">Observações da legenda (internas)</label><textarea id="capNotes" placeholder="Não aparece no post">${esc(i.captionNotes||'')}</textarea></div>
  <div><button class="btn primary" type="submit">${I('i-check')}Salvar legenda</button></div></form></div>`;
}
function updateCapCount(){
  const t=document.getElementById('capText'); if(!t) return; const n=t.value.length;
  const tags=(t.value+' '+(document.getElementById('capTags')?.value||'')).match(/#[\wÀ-ÿ]+/g)||[];
  document.getElementById('capCount').innerHTML=`<span class="${n>IG_LIMIT?'over':''}">${n.toLocaleString('pt-BR')} / ${IG_LIMIT.toLocaleString('pt-BR')} caracteres</span>`;
  document.getElementById('tagCount').innerHTML=`<span class="${tags.length>30?'over':''}">${tags.length} / 30 hashtags</span>`;

function commentsAndHistory(i){
  const cm=i.comments||[]; const h=(i.history||[]).slice().reverse();
  return `<div class="sec"><div class="sec-h"><h3>Comentários e ajustes</h3></div><div class="comments">${cm.length?cm.map(x=>`<div class="cmt">${avatar(x.author)}<div class="body"><div class="who"><b>${esc(member(x.author)?.name||'Equipe')}</b> · ${fmtDT(x.date)}</div>${esc(x.text)}</div></div>`).join(''):'<div class="muted" style="font-size:13px">Nenhum comentário.</div>'}
  <form data-form="comment" class="grid" style="gap:8px"><div class="f"><textarea id="cmtIn" placeholder="Registre um ajuste ou observação para o designer" required></textarea></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select class="sel" id="cmtAuthor" aria-label="Autor">${options(teamOpts(),S.data.team[0]?.id)}</select><button class="btn primary sm" type="submit">Comentar</button></div></form></div></div>

function designerDrawer(i){
  const isAd=i.kind==='ad'; const lastAdj=(i.comments||[]).slice(-3).reverse();
  const nx=NEXT[i.status];
  const rows=[
    ['O que precisa ser produzido',`<span class="dz-v big">${esc(i.title)}</span><div style="margin-top:6px">${typeEl(i.type,true)}</div>`],
    ['Objetivo da peça',esc(i.objective==='Outro'&&i.objectiveOther?i.objectiveOther:i.objective||'—')],
    ['Formato',`<span class="mono">${esc(i.customSize||i.format||'—')}</span>`],
    ['Texto que precisa aparecer na arte',esc(isAd?(i.platform==='google'?[i.t1,i.t2,i.t3].filter(Boolean).join('\n'):[i.headline,i.cta].filter(Boolean).join('\n')):i.artText)||'<span class="muted">Sem texto definido.</span>'],
    ['Orientações criativas',esc(isAd?i.notes:i.brief)||'<span class="muted">Sem orientações.</span>'],
    ['Referências',(i.references||[]).length?(i.references||[]).map(r=>{const u=safeUrl(r);return u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(r)}</a>`:esc(r);}).join('\n'):'<span class="muted">Sem referências.</span>'],
    ['Link dos materiais',(safeUrl(i.artLink)?`<a class="btn open-art" href="${esc(safeUrl(i.artLink))}" target="_blank" rel="noopener">${I('i-ext')}ABRIR ARTE</a>`:'<span class="muted">Ainda sem link da arte.</span>')+((i.attachments||[]).length?'\n'+(i.attachments||[]).map(a=>`<a href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener">${esc(a.label||'Anexo')}</a>`).join(' · '):'')],
    ['Prazo',`${fmtDL(i.date)}${isLate(i)?' · <b style="color:var(--danger)">atrasado</b>':''}`],
    ['Status',`${statusEl(i.status,true)}${nx?` <button class="btn primary sm" style="margin-left:8px" data-act="advance" data-kind="${i.kind}" data-id="${esc(i.id)}">${esc(NEXT_LABEL[nx]||ST[nx])} ${I('i-arrow')}</button>`:''}`],
    ['Observações e ajustes',lastAdj.length?lastAdj.map(c=>`<b>${esc(member(c.author)?.name||'Equipe')}</b> · <span class="muted mono" style="font-size:12px">${fmtDT(c.date)}</span>\n${esc(c.text)}`).join('\n\n'):'<span class="muted">Nenhum ajuste solicitado.</span>']
  ];
  return `<div class="d-head"><div class="d-bar"><span class="eyebrow">Modo Designer</span><div style="display:flex;gap:2px">${S.ui.view!=='designer'||true?`<button class="btn ghost sm" data-act="designer-toggle">${I('i-eye')}Visão completa</button>`:''}<button class="btn ghost sm" data-act="close-drawer" aria-label="Fechar">${I('i-x')}</button></div></div></div>
  <div class="d-body"><div class="dz">${rows.map(([l,v],ix)=>`<div class="dz-item"><span class="dz-n">${String(ix+1).padStart(2,'0')}</span><div><div class="dz-l">${l}</div><div class="dz-v">${v}</div></div></div>`).join('')}</div></div>`;
}

function duplicate(kind,id){
  const o=raw(kind,id); if(!o) return;
  const c=clone(o); c.id=uid(kind==='ad'?'ad':'ct'); c.status='ideia'; c.comments=[]; c.archived=false;
  c.history=[{date:new Date().toISOString(),from:null,to:'ideia',note:'Duplicado de “'+(o.title||adTitle(o))+'”'}];
  if(kind==='ad'){ if(c.adName) c.adName+=' (variação)'; else c.campaignName+=' (variação)'; } else c.title+=' (cópia)';
  put(kind==='ad'?'ads':'contents',c); toast(kind==='ad'?'Variação do anúncio criada':'Conteúdo duplicado');
  openDrawer(kind,c.id);
}
function toggleArchive(kind,id){ const o=raw(kind,id); if(!o) return; patch(kind,id,{archived:!o.archived},o.archived?'Conteúdo restaurado':'Conteúdo arquivado'); if(!o.archived && S.drawer && S.drawer.id===id) closeDrawer(); }
async function copyText(text,btn){
  let ok=false; try{ await navigator.clipboard.writeText(text); ok=true; }catch(e){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); }
  if(ok){ toast('Copiado para a área de transferência'); if(btn){ const h=btn.innerHTML; btn.innerHTML=I('i-check')+'Copiado'; setTimeout(()=>{btn.innerHTML=h;},1400);} }
  else toast('Não foi possível copiar. Selecione o texto manualmente.','err');
}
function adCopyText(a){ return a.platform==='google' ? [a.t1,a.t2,a.t3].filter(Boolean).map((t,n)=>'Título '+(n+1)+': '+t).concat([a.d1,a.d2].filter(Boolean).map((t,n)=>'Descrição '+(n+1)+': '+t)).join('\n') : [a.copy,a.headline&&'Headline: '+a.headline,a.description&&'Descrição: '+a.description,a.cta&&'CTA: '+a.cta].filter(Boolean).join('\n\n'); }
function toast(msg,kind){ const t=document.createElement('div'); t.className='toast'+(kind==='err'?' err':''); t.innerHTML=(kind==='err'?I('i-alert'):I('i-check'))+'<span></span>'; t.querySelector('span').textContent=msg; document.getElementById('toasts').appendChild(t); setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); },2600); }
function insertAtCursor(ta,text){ const s=ta.selectionStart,e=ta.selectionEnd; ta.value=ta.value.slice(0,s)+text+ta.value.slice(e); ta.selectionStart=ta.selectionEnd=s+text.length; ta.focus(); updateCapCount(); }

function shiftMonth(d){ let m=S.ui.month+d, y=S.ui.year; if(m<0){m=11;y--;} if(m>11){m=0;y++;} S.ui.month=m; S.ui.year=y; S.ui.weekStart=null; renderAll(); }

document.addEventListener('click',e=>{
  const pop=document.getElementById('pop');
  if(popKind && !pop.contains(e.target) && !e.target.closest('[data-act$="-pop"]')) closePop();
  if(e.target.closest('a[href^="http"]')) return; // links externos seguem normalmente
  const ch=e.target.closest('.choice');
  if(ch){ const g=ch.parentElement; if(g.dataset.multi){ ch.classList.toggle('on'); } else { g.querySelectorAll('.choice').forEach(b=>b.classList.remove('on')); ch.classList.add('on'); if(g.dataset.choice==='platform'&&modalCtx&&modalCtx.type==='ad'&&!modalCtx.id){ adForm(null,ch.dataset.v); } if(g.dataset.choice==='type'){ const fm={estatico:'Feed 1080x1350',carrossel:'Carrossel 1080x1350',reel:'Story/Reels 1080x1920',story:'Story/Reels 1080x1920',google:'Google Display'}[ch.dataset.v]; if(fm){ const fg=document.querySelector('[data-choice="format"]'); fg&&fg.querySelectorAll('.choice').forEach(b=>b.classList.toggle('on',b.dataset.v===fm)); } } } return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, kind=el.dataset.kind, id=el.dataset.id;
  if(el.tagName==='A' && a==='nav') e.preventDefault();
  switch(a){
    case 'nav': setView(el.dataset.view); break;
    case 'menu': document.getElementById('side').classList.toggle('on'); break;
    case 'month-prev': shiftMonth(-1); break;
    case 'month-next': shiftMonth(1); break;
    case 'month-pop': monthPop(el); break;
    case 'year': S.ui.year+=Number(el.dataset.d); renderAll(); monthPop(document.getElementById('monthLabel')); popKind='month'; break;
    case 'pick-month': S.ui.month=Number(el.dataset.m); S.ui.weekStart=null; closePop(); renderAll(); break;
    case 'filters-pop': filtersPop(el); break;
    case 'notif-pop': notifPop(el); break;
    case 'clear-filter': S.ui.f[el.dataset.k]=''; renderAll(); break;
    case 'clear-q': S.ui.q=''; document.getElementById('q').value=''; renderAll(); break;
    case 'clear-all-filters': for(const k in S.ui.f) S.ui.f[k]=''; S.ui.q=''; document.getElementById('q').value=''; closePop(); renderAll(); break;
    case 'new-content': { e.stopPropagation(); const pre={}; if(el.dataset.date) pre.date=el.dataset.date; if(el.dataset.campaign) pre.campaignId=el.dataset.campaign; contentForm(null,pre); break; }
    case 'new-ad': adForm(null,el.dataset.p); break;
    case 'new-campaign': campaignForm(null); break;
    case 'edit-campaign': campaignForm(camp(id)); break;
    case 'dup-campaign': { const c=clone(camp(id)); c.id=uid('c'); c.name+=' (cópia)'; c.status='planejamento'; put('campaigns',c); S.ui.campaign=c.id; toast('Campanha duplicada'); break; }
    case 'new-caption': captionForm(null); break;
    case 'edit-caption': captionForm(S.data.captions.find(c=>c.id===id)); break;
    case 'del-caption': closeModal(); del('captions',id); toast('Legenda excluída'); break;
    case 'open': closePop(); if(kind==='caption'){ captionForm(S.data.captions.find(c=>c.id===id)); break; } openDrawer(kind,id,S.ui.view==='designer'); break;
    case 'open-designer': openDrawer(kind,id,true); break;
    case 'open-campaign': S.ui.view='campaigns'; S.ui.campaign=id; saveUi(); renderAll(); window.scrollTo(0,0); break;
    case 'campaign-back': S.ui.campaign=null; renderAll(); break;
    case 'close-drawer': closeDrawer(); break;
    case 'close-modal': closeModal(); break;
    case 'edit': if(kind==='ad') adForm(raw('ad',id)); else contentForm(raw('content',id)); break;
    case 'dup': e.stopPropagation(); duplicate(kind,id); break;
    case 'archive': e.stopPropagation(); toggleArchive(kind,id); break;
    case 'advance': { e.stopPropagation(); const o=raw(kind,id); if(o&&NEXT[o.status]) changeStatus(kind,id,NEXT[o.status],''); break; }
    case 'advance-note': { const o=raw(kind,id); const note=document.getElementById('stNote')?.value||''; if(o&&NEXT[o.status]) changeStatus(kind,id,NEXT[o.status],note); break; }
    case 'request-adj': { const note=document.getElementById('stNote')?.value.trim(); const o=raw(kind,id); if(!note){ toast('Descreva o ajuste no campo de observação.','err'); document.getElementById('stNote').focus(); break; }
      const comments=(o.comments||[]).concat([{date:new Date().toISOString(),author:S.data.team[0]?.id||'',text:note}]); const history=(o.history||[]).concat([{date:new Date().toISOString(),from:o.status,to:'ajustes',note}]);
      patch(kind,id,{status:'ajustes',comments,history},'Ajustes solicitados'); break; }
    case 'designer-toggle': S.designer=!S.designer; renderDrawer(true); break;
    case 'dtab': S.dtab=el.dataset.k; renderDrawer(true); break;
    case 'kpi': { const g=el.dataset.go; for(const k in S.ui.f) S.ui.f[k]=''; if(g==='ads'){ setView('ads'); } else { if(['revisao','aprovado','publicado'].includes(g)) S.ui.f.status=g; setView(g==='prod'||g==='all'?'production':'contents'); } break; }
    case 'goto-status': for(const k in S.ui.f) S.ui.f[k]=''; S.ui.f.status=el.dataset.s; setView('contents'); break;
    case 'pend-tab': S.ui.pend=el.dataset.k; renderAll(); break;
    case 'nav-cal-list': S.ui.cal='list'; setView('calendar'); break;
    case 'cal-view': S.ui.cal=el.dataset.v; saveUi(); renderAll(); break;
    case 'week-prev': case 'week-next': { const d=weekStart(); d.setDate(d.getDate()+(a==='week-next'?7:-7)); S.ui.weekStart=iso(d); S.ui.month=d.getMonth(); S.ui.year=d.getFullYear(); renderAll(); break; }
    case 'week-today': { const d=new Date(today); d.setDate(d.getDate()-d.getDay()); S.ui.weekStart=iso(d); S.ui.month=today.getMonth(); S.ui.year=today.getFullYear(); renderAll(); break; }
    case 'ads-tab': S.ui.adsTab=el.dataset.v; saveUi(); renderAll(); break;
    case 'lib-view': S.ui.lib=el.dataset.v; saveUi(); renderAll(); break;
    case 'lib-clear': for(const k in S.ui.libF) S.ui.libF[k]=''; renderAll(); break;
    case 'rep-scope': S.ui.repScope=el.dataset.v; renderAll(); break;
    case 'toggle-archived': S.ui.showArchived=!S.ui.showArchived; renderAll(); break;
    case 'copy-text': copyText(el.dataset.text,el); break;
    case 'copy-ad': { const o=raw('ad',id); if(o) copyText(adCopyText(o),el); break; }
    case 'copy-caption': { const o=curDrawerRaw(); const t=document.getElementById('capText'); const text=[t?t.value:o.caption,document.getElementById('capCta')?.value,document.getElementById('capTags')?.value].filter(Boolean).join('\n\n'); copyText(text,el); break; }
    case 'emoji': insertAtCursor(document.getElementById('capText'),el.dataset.e); break;
    case 'ins-cta': { const v=document.getElementById('capCta').value.trim(); if(!v){ toast('Preencha o campo CTA primeiro.','err'); document.getElementById('capCta').focus(); break; } insertAtCursor(document.getElementById('capText'),'\n\n'+v); break; }
    case 'ins-tags': { const v=document.getElementById('capTags').value.trim(); if(!v){ toast('Preencha o campo Hashtags primeiro.','err'); document.getElementById('capTags').focus(); break; } insertAtCursor(document.getElementById('capText'),'\n\n'+v); break; }
    case 'del-ref': { const o=curDrawerRaw(); const refs=(o.references||[]).slice(); refs.splice(+el.dataset.ix,1); patch(S.drawer.kind,o.id,{references:refs},'Referência removida'); break; }
    case 'del-att': { const o=curDrawerRaw(); const at=(o.attachments||[]).slice(); at.splice(+el.dataset.ix,1); patch(S.drawer.kind,o.id,{attachments:at},'Anexo removido'); break; }
    case 'dyn-add': { const box=document.getElementById('refsDyn'); const row=document.createElement('div'); row.className='dyn-row'; row.innerHTML=`<input name="ref" placeholder="Link de post, concorrente, campanha ou inspiração" aria-label="Referência"><button type="button" class="btn ghost sm" data-act="dyn-del" aria-label="Remover">${I('i-x')}</button>`; box.appendChild(row); row.querySelector('input').focus(); break; }
    case 'dyn-del': { const box=el.closest('.dyn'); if(box.children.length>1) el.closest('.dyn-row').remove(); else el.closest('.dyn-row').querySelector('input').value=''; break; }
    case 'del-member': { if(S.data.team.length<=1){ toast('A equipe precisa de pelo menos uma pessoa.','err'); break; } const m=member(id); del('team',id); toast((m?m.name:'Pessoa')+' removida da equipe'); break; }
    case 'reset-local': try{ localStorage.removeItem('ph-data'); }catch(_){} loadSeed().then(d=>{ if(d){ Object.assign(S.data,clone(d)); localSave(); renderAll(); toast('Dados de exemplo restaurados'); } }); break;
    case 'load-seed': loadExample(el); break;
  }
});
async function loadExample(btn){
  const d=await loadSeed(); if(!d||!S.db){ toast('Não foi possível carregar o exemplo.','err'); return; }
  btn.disabled=true; btn.textContent='Carregando…';
  try{
    await S.db.doc('meta/settings').set(d.settings);
    for(const col of COLS) for(const o of d[col]){ const {id,...b}=o; await S.db.collection(col).doc(id).set(b); }
    toast('Dados de exemplo carregados');
  }catch(e){ toast('Não foi possível carregar o exemplo.','err'); btn.disabled=false; btn.textContent='Carregar dados de exemplo'; }
}
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act-change]');
  if(el){ const a=el.dataset.actChange, k=el.dataset.k;
    if(a==='flt'){ S.ui.f[k]=el.value; renderAll(); el.classList.toggle('set',!!el.value); }
    if(a==='lib-f'){ S.ui.libF[k]=el.value; renderAll(); }
    if(a==='cap-f'){ S.ui.capF[k]=el.value; renderAll(); }
    return; }
  if(e.target.id==='stSel' && S.drawer){ const note=document.getElementById('stNote')?.value||''; changeStatus(S.drawer.kind,S.drawer.id,e.target.value,note); }
  if(e.target.id==='cfDate' && e.target.value){ const m=document.getElementById('cfMonth'); if(m) m.value=e.target.value.slice(0,7); }
});
document.addEventListener('input',e=>{ if(e.target.id==='capText'||e.target.id==='capTags') updateCapCount(); if(e.target.classList.contains('err')) e.target.classList.remove('err'); });
document.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==='contentForm') return submitContent(f);
  if(f.id==='adForm') return submitAd(f);
  if(f.id==='campForm') return submitCampaign(f);
  if(f.id==='capForm') return submitCaption(f);
  if(f.id==='brandForm'){ const fd=new FormData(f); putSettings(Object.assign({},S.data.settings,{brand:fd.get('brand').trim()||'Sua marca',handle:fd.get('handle').trim()})); toast('Marca atualizada'); return; }
  if(f.id==='memberForm'){ const fd=new FormData(f); const name=fd.get('name').trim(); if(!name) return; put('team',{id:uid('u'),name,role:fd.get('role').trim(),initials:name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}); toast(name+' adicionada à equipe'); return; }
  const o=curDrawerRaw(); if(!o) return; const kind=S.drawer.kind;
  switch(f.dataset.form){
    case 'art-link': { const v=f.querySelector('#artLinkIn').value.trim(); if(!safeUrl(v)){ toast('Cole um link válido (https://…).','err'); return; } patch(kind,o.id,{artLink:v},'Link da arte salvo'); break; }
    case 'add-ref': { const v=f.querySelector('#refIn').value.trim(); if(!v) return; f.querySelector('#refIn').blur(); patch(kind,o.id,{references:(o.references||[]).concat([v])},'Referência adicionada'); break; }
    case 'add-att': { const u=f.querySelector('#attUrl').value.trim(); if(!safeUrl(u)){ toast('Cole um link válido (https://…).','err'); return; } const l=f.querySelector('#attLabel').value.trim()||('V'+((o.attachments||[]).length+1)); document.activeElement.blur(); patch(kind,o.id,{attachments:(o.attachments||[]).concat([{label:l,url:u,date:new Date().toISOString()}])},'Anexo adicionado'); break; }
    case 'caption': { document.activeElement.blur(); patch(kind,o.id,{caption:f.querySelector('#capText').value,cta:f.querySelector('#capCta').value,hashtags:f.querySelector('#capTags').value,captionNotes:f.querySelector('#capNotes').value},'Legenda salva'); break; }
    case 'comment': { const t=f.querySelector('#cmtIn').value.trim(); if(!t) return; const author=f.querySelector('#cmtAuthor').value; document.activeElement.blur(); patch(kind,o.id,{comments:(o.comments||[]).concat([{date:new Date().toISOString(),author,text:t}])},'Comentário adicionado'); break; }
  }
});
let qT=0;
document.getElementById('q').addEventListener('input',e=>{ clearTimeout(qT); qT=setTimeout(()=>{ S.ui.q=e.target.value; if(S.ui.q && ['dashboard','reports','settings'].includes(S.ui.view)) { S.ui.view='contents'; saveUi(); } renderAll(); },180); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(popKind) closePop(); else if(document.getElementById('modalWrap').classList.contains('on')) closeModal(); else if(S.drawer) closeDrawer(); }
  if((e.key==='n'||e.key==='N') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !e.metaKey && !e.ctrlKey && !document.getElementById('modalWrap').classList.contains('on')){ e.preventDefault(); contentForm(null,{}); }
  if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); document.getElementById('q').focus(); }
  if(e.key==='Enter' && e.target.classList.contains('kcard')) e.target.click();
});
document.getElementById('modalWrap').addEventListener('mousedown',e=>{ if(e.target.id==='modalWrap') closeModal(); });

/* ---------- Arrastar e soltar ---------- */
let dragKey=null;
document.addEventListener('dragstart',e=>{ const d=e.target.closest('[data-drag]'); if(!d) return; dragKey=d.dataset.drag; d.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragKey); }catch(_){} });
document.addEventListener('dragend',e=>{ const d=e.target.closest('[data-drag]'); d&&d.classList.remove('dragging'); document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop')); dragKey=null; });
document.addEventListener('dragover',e=>{ const t=e.target.closest('[data-drop-status],[data-drop-date]'); if(!t||!dragKey) return; e.preventDefault(); document.querySelectorAll('.drop').forEach(x=>x!==t&&x.classList.remove('drop')); t.classList.add('drop'); });
document.addEventListener('drop',e=>{ const t=e.target.closest('[data-drop-status],[data-drop-date]'); if(!t||!dragKey) return; e.preventDefault(); const [kind,id]=dragKey.split(':');
  if(t.dataset.dropStatus) changeStatus(kind,id,t.dataset.dropStatus,'Movido no quadro de produção');
  else { const o=raw(kind,id); if(o && o.date!==t.dataset.dropDate) patch(kind,id,{date:t.dataset.dropDate},'Data alterada para '+fmtD(t.dataset.dropDate)); }
  t.classList.remove('drop'); dragKey=null; });

function afterRender(){
  document.querySelectorAll('.kcard').forEach(k=>k.tabIndex=0);
  if(location.hash && location.hash.length>1){ /* hash só para navegação inicial */ }
}
const h=(location.hash||'').slice(1); if(h && ['dashboard','calendar','contents','ads','campaigns','production','library','captions','reports','settings','designer'].includes(h)) S.ui.view=h;
boot();
})();
</script>

</body>
</html>
